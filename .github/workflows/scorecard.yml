name: scorecard

# OpenSSF Scorecard: scores this repository on every push to main and once a week, and publishes the result at
# https://scorecard.dev/viewer/?uri=github.com/Wafio/wafio-cp-frontend

on:
  push:
    branches: [main]
  schedule:
    - cron: '29 3 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the result to code scanning
      id-token: write # sign the published result
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
